; ============================================================
; Abarrotería Los Nina — PHP para producción (Koyeb)
; Se copia a /usr/local/etc/php/conf.d/ en la imagen Docker.
; ============================================================

; Nunca mostrar errores al visitante; sí registrarlos.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
expose_php = Off

; Sesiones endurecidas (HttpOnly + SameSite + modo estricto).
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 7200

; Se ejecuta antes de cada request: activa cookie Secure solo si hay HTTPS.
auto_prepend_file = /var/www/html/config/prepend.php

; Subidas moderadas (el sitio no recibe archivos, pero acota el riesgo).
upload_max_filesize = 2M
post_max_size = 4M
